<!DOCTYPE html> 
 
<html> 
 
<head> 
 
  <meta charset="utf-8"> 
 
  <title>My A-Frame World</title> 
 
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script> 
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
 
</head> 
 
<body> 

  <a-asset>

    <img 
    id="waves" 
    src="images/AdobeStock_408699409.jpeg">

  </a-asset>
 
  <a-scene> 
 
    <a-box 
      position="0 1 -3" 
      color="#ff2a8a" 
      src="#waves"></a-box>
    </a-box> 
 
    <a-plane 
      position="0 0 -4" 
      rotation="-90 0 0" 
      width="10" 
      height="10" 
      color="#ff6a00"> 
    </a-plane> 
 
    <a-sky color="#241b2f"></a-sky> 

    <a-entity environment="preset: forest;" dressingColor="#795430;"></a-entity>





  </a-scene> 
 
</body> 
 
</html>
